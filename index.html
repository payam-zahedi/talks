<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talks · Payam Zahedi</title>
<meta name="description" content="Slides from Payam Zahedi's conference talks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root {
  color-scheme: light dark;
  --bg: #FAFAF7; --ink: #1B1F2A; --dim: #6A7179; --rule: #E3E6E4; --accent: #0468D7; --card: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0C0E13; --ink: #E8ECF2; --dim: #97A1B2; --rule: #2B3242; --accent: #7FB3FF; --card: #151922; }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.55 'IBM Plex Sans', Arial, sans-serif;
}
main { max-width: 760px; margin: 0 auto; padding: 72px 16px 96px; }
h1 { font-size: 40px; line-height: 1.15; margin: 0 0 8px; }
.lede { color: var(--dim); margin: 0 0 48px; }
.lede a { color: inherit; }
ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.talk {
  display: block; padding: 24px; border: 1px solid var(--rule); border-radius: 12px;
  background: var(--card); color: inherit; text-decoration: none;
  transition: border-color .15s ease, transform .15s ease;
}
.talk:hover, .talk:focus-visible { border-color: var(--accent); transform: translateY(-1px); outline: none; }
.meta { font: 13px/1.4 'JetBrains Mono', monospace; color: var(--dim); margin: 0 0 8px; }
.talk h2 { font-size: 21px; line-height: 1.3; margin: 0 0 8px; }
.talk p { margin: 0; color: var(--dim); }
.links { margin: 10px 0 0 4px; font-size: 15px; }
.links a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Talks</h1>
  <p class="lede">Slides from conference talks by Payam Zahedi. Source on <a href="https://github.com/payam-zahedi/talks">GitHub</a>.</p>
  <ol>
    <li>
      <a class="talk" href="fluttercon-2026-ai-code-review/">
        <p class="meta">flutterCon Berlin · Oct 2026</p>
        <h2>From Review Bottleneck to Auto-Merge</h2>
        <p>How our Flutter team uses AI for code review on GitHub, and which pull requests can merge without a human.</p>
      </a>
      <p class="links"><a href="https://github.com/payam-zahedi/talks/tree/main/fluttercon-2026-ai-code-review">Files on GitHub</a></p>
    </li>
  </ol>
</main>
</body>
</html>
